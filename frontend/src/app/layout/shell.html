<div class="flex h-full bg-slate-50 text-slate-900">
  <aside class="flex w-60 shrink-0 flex-col border-r border-slate-200 bg-white">
    <div class="flex h-14 items-center border-b border-slate-200 px-5">
      <span class="text-lg font-semibold">{{ 'app.name' | translate }}</span>
    </div>

    <nav class="flex-1 space-y-1 p-3">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-slate-100 font-medium"
          class="block rounded-md px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
        >
          {{ item.labelKey | translate }}
        </a>
      }
    </nav>

    <!-- mt-auto empuja este bloque al fondo del sidebar -->
    <div class="border-t border-slate-200 p-3">
      <p class="truncate px-3 pb-2 text-xs text-slate-500">{{ user()?.email }}</p>
      <button
        type="button"
        (click)="logout()"
        class="w-full rounded-md px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-100"
      >
        {{ 'nav.logout' | translate }}
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 items-center border-b border-slate-200 bg-white px-6">
      <span class="text-sm text-slate-500">{{ 'app.tagline' | translate }}</span>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
