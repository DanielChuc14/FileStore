# Nginx del contenedor frontend. Es el unico punto de entrada web: termina TLS,
# sirve el SPA y hace de reverse proxy hacia la API.

upstream filestore_api {
    server api:8080;
}

# Redireccion de HTTP a HTTPS. Se deja abierta la ruta del challenge de ACME
# para que certbot pueda renovar el certificado sin apagar el servidor.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificados de Let's Encrypt, montados desde el host (ver DEPLOYMENT.md).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Debe superar el MaxFileSizeBytes de la app (10 MB por defecto), o Nginx
    # cortaria las subidas grandes antes de que lleguen a la API.
    client_max_body_size 20m;

    # --- Headers de seguridad ---
    # Fuerza HTTPS en el navegador por un año.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Impide que la pagina se embeba en un iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Impide que el navegador adivine tipos MIME.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API ---
    location /api/ {
        # Se quita el prefijo /api antes de reenviar: la API no lo conoce.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://filestore_api;

        proxy_set_header Host $host;
        # Estos dos headers son los que lee ForwardedHeaders en la API para
        # recuperar el esquema y la IP real del cliente (para el audit log).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Fallback al index.html: sin esto, recargar una ruta como /files daria
        # 404 porque ese archivo no existe; el enrutado lo hace Angular.
        try_files $uri $uri/ /index.html;
    }
}
